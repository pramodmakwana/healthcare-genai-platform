# Lightweight stack sized for an 8GB laptop (WSL2): Postgres+pgvector and the API.
# Memory limits keep it well under the WSL2 cap. Airflow is optional - see dags/README.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hcai
      POSTGRES_PASSWORD: hcai
      POSTGRES_DB: hcai
    ports:
      - "5433:5432"   # 5433 so it doesn't clash with the Postgres in healthcare-fhir-data-pipeline
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcai -d hcai"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build: .
    env_file: .env
    environment:
      VECTOR_STORE: pgvector
      PG_DSN: postgresql://hcai:hcai@pgvector:5432/hcai
      AGENT_CHECKPOINTER: postgres   # paused agent reviews survive container restarts
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      pgvector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  pgvector_data:
