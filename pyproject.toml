[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcai"
version = "0.3.0"
description = "Healthcare GenAI platform: RAG over FHIR records and clinical guidelines, with guardrails and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pramod Makwana" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "langgraph>=0.4",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3", "psycopg-pool>=3.2", "langgraph-checkpoint-postgres>=2.0"]
local-embeddings = ["fastembed>=0.3"]
openai = ["openai>=1.30"]
gemini = ["google-genai>=0.3"]
bedrock = ["boto3>=1.34"]
orchestration = ["dagster>=1.8"]
all = ["hcai[faiss,chroma,pgvector,openai,gemini,bedrock]"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
hcai-ingest = "hcai.ingestion.pipeline:main"
hcai-eval = "hcai.eval.run_eval:main"
hcai-agent-eval = "hcai.eval.run_agent_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
