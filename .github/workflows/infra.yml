# Infrastructure checks on every change to infra/: formatting, validation, plan-time
# tests against a mocked AWS provider, and a Checkov security scan. Needs no AWS account.
# `apply` is done by a person from their machine (see docs/RUNBOOK.md), not by CI.
name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - name: Plan-time security tests (mocked AWS provider)
        run: tofu test
      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
