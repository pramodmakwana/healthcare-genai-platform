name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hcai
          POSTGRES_PASSWORD: hcai
          POSTGRES_DB: hcai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hcai" --health-interval 5s --health-retries 10
    env:
      TEST_PG_DSN: postgresql://hcai:hcai@localhost:5432/hcai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[faiss,pgvector,orchestration,dev]"
      - name: Lint
        run: ruff check src tests scripts dags orchestration
      - name: Unit, API and Postgres tests (pgvector store, agent checkpoints)
        run: pytest -q
      - name: Offline RAG evaluation (mock LLM, quality gate)
        run: |
          python -m hcai.eval.run_eval
          python - <<'EOF'
          import json, sys
          r = {e["name"]: e for e in json.load(open("reports/eval_results.json"))["experiments"]}["improved"]
          s = json.load(open("reports/eval_results.json"))["safety"]
          print(r)
          assert r["hit_at_k"] >= 0.9, "retrieval regression"
          assert r["evidence_recall"] >= 0.85, "evidence recall regression"
          assert r["correct_refusal_rate"] >= 0.8, "abstention regression"
          assert s["harmful_caught"] == 1.0 and s["benign_false_positive_rate"] == 0.0, "guardrail regression"
          EOF
      - name: Agent evaluation (quality gate)
        run: |
          python -m hcai.eval.run_agent_eval
          python - <<'EOF'
          import json
          r = json.load(open("reports/agent_eval_results.json"))
          assert r["prior_auth"]["status_accuracy"] >= 0.95, "prior-auth triage regression"
          assert r["discharge"]["issue_recall"] >= 0.95, "discharge reviewer regression"
          assert r["discharge"]["complete_after_signoff"] == 1.0
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hcai-api:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=mock hcai-api:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question":"At what eGFR should metformin be stopped?"}' | tee /dev/stderr | grep -q '30'
