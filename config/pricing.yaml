# USD per million tokens. Used by the eval harness and the /ask response to report cost per query.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-11-21).
# Prices change; re-check before quoting cost figures. Add other providers' models as you wire them up.
models:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50   # 5-minute cache write
    cache_read: 0.10
  claude-haiku-5-5:     # prompts <= 100K tokens (this platform's prompts are far smaller)
    input: 0.10
    output: 0.50
    cache_write: 0.125
    cache_read: 0.01
  mock:
    input: 0.0
    output: 0.0
    cache_write: 0.0
    cache_read: 0.0
